name: Local platform qualification
on: [push, pull_request]
jobs:
  lifecycle:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      PYTHONPATH: runner
      ONNXRUNTIME_NODE_INSTALL: skip
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install -r requirements-lock.txt
      - run: praxis suites list
      - run: npm ci
      - run: python -m playwright install --with-deps chromium
      - run: npm run build --workspace apps/web
      - run: npm run build --workspace apps/website
      - name: Disposable lifecycle with explicitly labeled fixtures
        run: python scripts/qualify_local.py --fixture-only --output work/platform-acceptance
      - name: Publish platform failure identifiers
        if: failure()
        run: python -c "import json; from pathlib import Path; p=Path('work/platform-acceptance/result.json'); d=json.loads(p.read_text()) if p.exists() else {}; print('::error title=Native platform qualification::'+d.get('error_type','Installation or build failure')+' after '+str(len(d.get('checks',[])))+' lifecycle checks')"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: local-platform-${{ matrix.os }}
          path: |
            work/platform-acceptance/result.json
            work/platform-acceptance/*.png
