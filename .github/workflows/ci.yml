name: Praxis verification
on: [push, pull_request]
jobs:
  local:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: ONNXRUNTIME_NODE_INSTALL=skip npm ci
      - run: python -m venv .venv && .venv/bin/python -m pip install --upgrade pip "setuptools>=84.1,<85" wheel && .venv/bin/python -m pip install -r requirements-lock.txt
      - run: .venv/bin/python -m playwright install --with-deps chromium
      - run: npm test
      - run: npm run test:typescript
      - run: npm run lint
      - run: npm run build
      - run: npm run test --workspace apps/api
      - run: npm run typecheck --workspace packages/contracts
