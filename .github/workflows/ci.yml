name: Praxis verification
on: [push, pull_request]
jobs:
  local:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: npm ci
      - run: python -m venv .venv && .venv/bin/python -m pip install --upgrade pip "setuptools>=61" wheel && .venv/bin/python -m pip install -e ".[test]"
      - run: npm test
      - run: npm run build
      - run: npm run test --workspace apps/api
      - run: npm run typecheck --workspace packages/contracts
