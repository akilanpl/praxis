[build-system]
requires = ["setuptools>=84.1,<85"]
build-backend = "setuptools.build_meta"

[project]
name = "praxis"
version = "0.1.0"
description = "Artifact-first local AI evaluation laboratory"
requires-python = ">=3.12"
dependencies = ["pydantic>=1.10,<3", "jsonschema>=4.17,<5"]

[project.optional-dependencies]
test = ["pytest>=9.0.3,<10", "pytest-cov>=7,<8", "pip-audit>=2.9,<3", "bandit==1.8.6", "defusedxml>=0.7.1,<1"]
browser = ["playwright>=1.48,<2"]

[project.scripts]
praxis = "praxis.cli:main"

[tool.setuptools]
package-dir = {"" = "runner"}

[tool.setuptools.packages.find]
where = ["runner"]

[tool.pytest.ini_options]
pythonpath = ["runner"]
testpaths = ["tests"]

[tool.setuptools.data-files]
"share/praxis/scenarios" = ["packages/scenarios/structured-agent-v1.json", "packages/scenarios/grounded-research-v1.json", "packages/scenarios/security-resilience-v1.json", "packages/scenarios/developer-contracts-v1.json", "packages/scenarios/agent-workflows-v1.json", "packages/scenarios/http-application-v1.json"]

[tool.coverage.run]
branch = true
concurrency = ["thread", "greenlet"]
