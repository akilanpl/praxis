<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Praxis owned shop fixture</title><style>body{font:16px sans-serif;max-width:800px;margin:auto;padding:16px}button,input{font:inherit;padding:8px}article{padding:16px;border:1px solid #888}#items{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px}</style><h1>Fixture stationery</h1><label for="search">Search</label><input id="search"><main id="items"><article data-name="Red book">Red book <button id="add">Add book</button></article><article data-name="Blue pen">Blue pen</article></main><p>Cart quantity: <output id="quantity">0</output></p><form><label for="email">Email</label><input id="email" type="email" required><button>Checkout</button></form><script>document.querySelector('#add').onclick=()=>document.querySelector('#quantity').value=Number(document.querySelector('#quantity').value)+1;document.querySelector('#search').oninput=e=>document.querySelectorAll('article').forEach(x=>x.hidden=!x.dataset.name.toLowerCase().includes(e.target.value.toLowerCase()));document.querySelector('form').onsubmit=e=>e.preventDefault()</script></html>
